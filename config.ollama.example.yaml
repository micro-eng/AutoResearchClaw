# AutoResearchClaw — local Ollama example
# Copy:  cp config.ollama.example.yaml config.arc.yaml
# Pull:  ollama pull qwen2.5:32b
# Run:   export OPENAI_API_KEY=ollama
#        researchclaw run --config config.arc.yaml --topic "Your idea" --auto-approve
#
# Docs: docs/openfang-ollama.md

project:
  name: "local-ollama-research"
  mode: "full-auto"

research:
  topic: "Your research topic here"
  domains:
    - "machine-learning"
  daily_paper_count: 8
  quality_threshold: 4.0

runtime:
  timezone: "America/New_York"
  max_parallel_tasks: 2
  approval_timeout_hours: 12
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "openai-compatible"
  # Ollama OpenAI-compatible API (must include /v1)
  base_url: "http://localhost:11434/v1"
  wire_api: "chat_completions"
  api_key_env: "OPENAI_API_KEY"
  # Ollama ignores the key; any non-empty value works
  api_key: "ollama"
  # Prefer a strong instruction/code model (32B+ recommended for full pipeline)
  primary_model: "qwen2.5:32b"
  fallback_models:
    - "llama3.1:70b"
    - "qwen2.5:14b"

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

experiment:
  # Start with "simulated" to validate LLM connectivity, then switch to "sandbox"
  mode: "sandbox"
  time_budget_sec: 300
  max_iterations: 6
  metric_key: "primary_metric"
  metric_direction: "minimize"
  sandbox:
    # Use ".venv/Scripts/python.exe" on Windows
    python_path: ".venv/bin/python3"
    gpu_required: false
    max_memory_mb: 4096
  # OpenCode beast mode usually needs a cloud/coding-agent model — off for Ollama
  opencode:
    enabled: false
    auto: false
    complexity_threshold: 0.5
    model: ""
    timeout_sec: 600
    max_retries: 0
    workspace_cleanup: true
  figure_agent:
    enabled: true
    min_figures: 2
    max_figures: 6
    max_iterations: 2
    render_timeout_sec: 60
    docker_image: "researchclaw/experiment:latest"
    output_format: "python"
    # Requires Gemini — disable for fully local runs
    nano_banana_enabled: false
    gemini_model: "gemini-2.5-flash-image"
    strict_mode: false
    dpi: 300

prompts:
  custom_file: ""

metaclaw_bridge:
  enabled: false
  proxy_url: "http://localhost:30000"
  skills_dir: "~/.metaclaw/skills"
  fallback_url: ""
  fallback_api_key: ""
  prm:
    enabled: false
    api_base: ""
    api_key_env: "PRM_API_KEY"
    api_key: ""
    model: "gpt-5.4"
    votes: 3
    gate_stages: [5, 9, 15, 20]
  lesson_to_skill:
    enabled: false
    min_severity: "error"
    max_skills_per_run: 3

export:
  target_conference: "neurips_2025"
  authors: "Anonymous"
  bib_file: "references"
